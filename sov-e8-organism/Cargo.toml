[package]
name = "sov-e8-organism"
version = "0.1.0"
edition = "2021"
description = "E₈ lattice organism: living mathematics through root systems and supersymmetric metabolism"
license = "AGPL-3.0"

[lib]
name = "sov_e8_organism"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
sov-core = { path = "../sov-core" }
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
ndarray = "0.15"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"
