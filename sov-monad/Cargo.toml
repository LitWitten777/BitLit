[package]
name = "sov-monad"
version = "0.1.0"
edition = "2021"
description = "Perceive-Embed-Reason loop architecture for Sovereign Geometric AI"
license = "MIT"

[lib]
name = "sov_monad"
crate-type = ["cdylib", "rlib"]

[dependencies]
sov-core = { path = "../sov-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
pyo3 = { version = "0.20", features = ["extension-module"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

